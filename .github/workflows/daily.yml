name: Daily Activity

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  activity:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update activity log
        run: echo "$(date '+%Y-%m-%d')" >> activity.log
      - name: Commit and push
        run: |
          git config user.name "Zhekabas"
          git config user.email "yevgen.bilonozhko@gmail.com"
          git add activity.log
          git commit -m "activity: $(date '+%Y-%m-%d')"
          git push
